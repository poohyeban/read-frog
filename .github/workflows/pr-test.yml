name: Read Frog Lite - Test and ZIP
on:
  workflow_dispatch:
    inputs:
      performance:
        description: Run the additional performance analysis and baseline rebuild
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SKIP_FREE_API: "true"
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git fetch --no-tags origin 18f2c8cbfddc3df5e4b7552a48b1731c28ac4cfd
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - name: Lint and TypeScript
        run: pnpm lint
      - name: Architecture boundaries
        run: pnpm check:architecture
      - name: Unit and local protocol tests
        run: pnpm test --maxWorkers=4
      - name: Chromium production ZIP
        id: build
        run: pnpm zip
      - name: Production content-script boundaries
        run: pnpm check:architecture --build
      - name: Upload unpackable MV3 extension
        uses: actions/upload-artifact@v4
        with:
          name: read-frog-lite-chromium-${{ github.sha }}
          path: .output/*-chrome.zip
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Install Chromium for real extension tests
        id: browser-install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Extension browser regression
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance-report:
    if: inputs.performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - name: Record raw synthetic and React Profiler samples
        run: pnpm perf:report
      - name: Compare isolated icon entry sizes
        run: pnpm perf:icons
      - name: Record production build graph and sizes
        run: |
          pnpm build:analyze
          node scripts/build-fingerprint.mjs
      - name: Install browser for production UI observations
        run: pnpm exec playwright install --with-deps chromium
      - name: Record production UI navigation timings
        run: PERF_BROWSER=true xvfb-run --auto-servernum pnpm test:e2e e2e/ui-performance.spec.ts
      - name: Rebuild the pinned 0.2.5 baseline in isolation
        run: |
          git fetch --no-tags origin 18f2c8cbfddc3df5e4b7552a48b1731c28ac4cfd
          git worktree add --detach "$RUNNER_TEMP/read-frog-025" 18f2c8cbfddc3df5e4b7552a48b1731c28ac4cfd
          cd "$RUNNER_TEMP/read-frog-025"
          pnpm install --frozen-lockfile
          pnpm build
          node "$GITHUB_WORKSPACE/scripts/build-fingerprint.mjs"
          cp scripts/output/performance/build.json "$GITHUB_WORKSPACE/scripts/output/performance/baseline-build.json"
      - name: Record the same production UI script against the baseline
        run: PERF_BROWSER=true PERF_LABEL=baseline PERF_EXTENSION_PATH="$RUNNER_TEMP/read-frog-025/.output/chrome-mv3" xvfb-run --auto-servernum pnpm test:e2e e2e/ui-performance.spec.ts
      - name: Repeat production observations in reverse order
        run: |
          PERF_BROWSER=true PERF_LABEL=baseline-repeat PERF_EXTENSION_PATH="$RUNNER_TEMP/read-frog-025/.output/chrome-mv3" xvfb-run --auto-servernum pnpm test:e2e e2e/ui-performance.spec.ts
          PERF_BROWSER=true PERF_LABEL=current-repeat xvfb-run --auto-servernum pnpm test:e2e e2e/ui-performance.spec.ts
      - name: Upload performance observations (no timing thresholds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-observations-${{ github.sha }}
          path: |
            scripts/output/performance/
            stats.html
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
