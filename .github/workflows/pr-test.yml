name: Read Frog Lite - Test and ZIP
on:
  push:
    branches: [codex/read-frog-independent]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SKIP_FREE_API: "true"
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - name: Lint and TypeScript
        run: pnpm lint
      - name: Unit and local protocol tests
        run: pnpm test --maxWorkers=4
      - name: Chromium production ZIP
        run: pnpm zip
      - name: Upload unpackable MV3 extension
        uses: actions/upload-artifact@v4
        with:
          name: read-frog-lite-chromium-${{ github.sha }}
          path: .output/*-chrome.zip
          if-no-files-found: error
          retention-days: 30
      - name: Install Chromium for real extension tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Extension browser regression
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
