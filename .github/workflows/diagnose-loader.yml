name: Verify 0.2.4 on Chrome 156
on:
  push:
    branches: [codex/diagnose-loader-156]
    paths: ['.diagnostics/**', '.github/workflows/diagnose-loader.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNTIME_EXTENSION_PATH: .diagnostics/extension
      RUNTIME_BROWSER_PATH: .diagnostics/chrome/chrome-linux64/chrome
      RUN_LIVE_YOUTUBE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40867034119
          name: read-frog-lite-chromium-b3cc86199e9a4108b397ea9702b6ee7db830e83a
          path: .diagnostics/artifact
      - name: Use the unchanged CI extension ZIP
        run: |
          sha256sum .diagnostics/artifact/read-frog-lite-0.2.4-chrome.zip
          unzip -q .diagnostics/artifact/read-frog-lite-0.2.4-chrome.zip -d .diagnostics/extension
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install Chrome for Testing 156.0.8078.47
        run: |
          curl --fail --location https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip -o /tmp/chrome.zip
          mkdir -p .diagnostics/chrome
          unzip -q /tmp/chrome.zip -d .diagnostics/chrome
      - name: Test website workers, messages and interrupted startup
        run: xvfb-run --auto-servernum pnpm exec playwright test --config .diagnostics/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-0.2.4-chrome156
          path: test-results/
          include-hidden-files: true
          retention-days: 14
