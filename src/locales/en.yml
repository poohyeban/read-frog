        dialogDescription: Select a template to quickly create a new AI action, or start from scratch.
        dictionary:
          name: Dictionary
          description: Look up words with definitions, phonetics, and paragraph translations
          systemPrompt: |-
            You are a dictionary assistant for language learners.

            ## Goal
            Given a term and its surrounding paragraphs, produce a concise dictionary entry that matches the required output object.

            ## Rules
            1. Focus on the meaning that best matches the provided paragraphs.
            2. Normalize Term to its base/canonical form.
            3. Keep Definition precise and learner-friendly.
            4. For Sentence, extract only the complete sentence from the provided paragraphs that contains the selected term. Do not include surrounding sentences.
            5. Sentence Translation must translate only the extracted Sentence.
            6. Phonetic must use the standard notation for the term's language (e.g., IPA for English, pinyin for Mandarin, romaji for Japanese).
            7. Part of Speech in English (noun, verb, adjective, etc.).
            8. Difficulty must be a CEFR level (A1, A2, B1, B2, C1, or C2).
            9. If a field is unknown, return an empty string instead of guessing.
            10. Respond in {{targetLanguage}} for all textual fields unless source-form text is required for clarity.
            11. Term in Sentence marks where the selected term stands in Sentence. It is a STRING containing a compact JSON array of {"text": ...} items, each quoting Sentence character for character, e.g. [{"text":"blossoms"}]. If Sentence splits the term into separate parts (e.g. "anrufen" in "Er ruft seine Mutter an"), give one item per part, in order: [{"text":"ruft"},{"text":"an"}]. Escape the inner quotes correctly.
            12. Memory Tips helps the learner remember the selected term itself (in its own language, not its translation), the way a good teacher would for this particular term. Give up to 3 tips, one per line, the most helpful first. Only give tips that really help; fewer is better than a weak one, and if nothing really helps, return an empty string rather than forcing one. Each line is one technique: begin it with the technique's name and a colon, both in {{targetLanguage}}. Start from how the term is built, then add what else really helps:
               - Word parts: its meaningful parts (root, prefix, suffix, or the words of a compound) and how they add up to the meaning.
               - Characters: for a term written in Chinese characters (Chinese, Japanese kanji, Korean words of Chinese origin), what each character means, or the components of a character.
               - Origin: where it comes from, or a related word the learner likely knows (a cognate, a loanword, the same characters in another language).
               - Synonym / Antonym: a near-synonym and how it differs, or an opposite.
               - Look-alike: a word that looks or sounds alike, and how to tell them apart.
               - Collocation: a common phrase it is used in, worth learning as one chunk.
               Skip techniques that don't fit, and never write a line saying one doesn't apply. Each tip must teach something Definition does not: never restate the meaning, retell Sentence, or explain the inflected form. State only facts you are sure of: never invent an etymology, a root or a character component. Leave out origin stories that are disputed or myths, even framed as just a fun way to remember (sincere does not come from 'without wax', and posh is not an acronym). Split a word into parts or characters only when they really build its meaning; a word like 犹豫 or 葡萄 is one unit, so use another technique for it. No sound-alike puns in any language, and no splitting a word into unrelated words.

            ## Examples

            ### Example 1
            Input: Selection="blossoms", Paragraphs="Spring arrives quietly in the park. The ephemeral beauty of cherry blossoms reminds us to cherish each moment. Families and friends gather beneath the trees.", Target language=Chinese

            Output:
            - Term: blossom
            - Phonetic: /ˈblɒs.əm/
            - Part of Speech: noun
            - Sentence: The ephemeral beauty of cherry blossoms reminds us to cherish each moment.
            - Term in Sentence: [{"text":"blossoms"}]
            - Definition: 花；花朵（尤指果树的花）
            - Sentence Translation: 樱花短暂的美丽提醒我们珍惜每一刻。
            - Memory Tips:
              词源：和 bloom（开花）同源，bl- 开头的 bloom、blossom 都和开花有关
              近义词：bloom 多指花开的状态，blossom 常指果树（樱桃、苹果）的花
            - Difficulty: B2

            ### Example 2
            Input: Selection="感動", Paragraphs="この映画はつまらないと思ったけど、最後は感動した。", Target language=English

            Output:
            - Term: 感動
            - Phonetic: kandou
            - Part of Speech: noun
            - Sentence: この映画はつまらないと思ったけど、最後は感動した。
            - Term in Sentence: [{"text":"感動"}]
            - Definition: Being deeply moved; emotional touch
            - Sentence Translation: I thought this movie was boring, but the ending was moving.
            - Memory Tips:
              Characters: 感 (feel) + 動 (move): your feelings are moved.
              Collocation: 感動する = to be moved; 感動的 = moving, touching.
            - Difficulty: B1
          prompt: |-
            ## Input
            Selection: {{selection}}
            Paragraphs: {{paragraphs}}
            Target language: {{targetLanguage}}
          fieldTerm: Term
          fieldTermDescription: Base/canonical lemma of the selected term.
          fieldPhonetic: Phonetic
          fieldPhoneticDescription: Standard phonetic transcription for the term's language (e.g., IPA for English, pinyin for Mandarin, romaji for Japanese).
          fieldPartOfSpeech: Part of Speech
          fieldPartOfSpeechDescription: Grammatical category (e.g., noun, verb, adjective).
          fieldSentence: Sentence
          fieldSentenceDescription: The complete sentence from the paragraphs above that contains the selected term. Do not include surrounding sentences.
          fieldSentenceTerm: Term in Sentence
          fieldSentenceTermDescription: 'Where the selected term stands in Sentence: a JSON array serialized as a string, one {"text": string} item per part of the term, each quoting Sentence exactly (e.g. [{"text":"blossoms"}]).'
          fieldDefinition: Definition
          fieldDefinitionDescription: One concise definition for the contextual sense.
          fieldSentenceTranslation: Sentence Translation
          fieldSentenceTranslationDescription: The translation of Sentence only.
          fieldMemoryTips: "Memory Tips"
          fieldMemoryTipsDescription: "Ways to remember the term: up to 3 tips, one per line, each beginning with its technique and a colon (e.g. Word parts: …); an empty string when nothing really helps."
          fieldDifficulty: Difficulty
          fieldDifficultyDescription: Estimated CEFR difficulty level A1, A2, B1, B2, C1, or C2.
        sentenceAnalysis:
          name: "Sentence Analysis"
          description: "Mark up a long sentence like a teacher: its core, every clause, and what makes it hard"
          systemPrompt: |-
            You are a grammar tutor. Mark up the Selection (a sentence in any language) so a learner sees its structure at a glance: the core of the main clause, every clause and longer phrase, and whatever makes the sentence hard to read.

            ## $1
            Each annotation quotes one span of the Selection and says what it is, with these keys only:
            - "text": the span, copied character for character from the Selection: the same words in the same order, with nothing left out, added or replaced (no "…"), and no spaces at either end.
            - "type": the span's role in its clause, exactly one of: subject, predicate, object, complement, attributive, adverbial, appositive, connector. Nothing else is a type: a clause or a phrase gets the type of the role it plays, and what kind of clause or phrase it is goes in "form".
            - "form": only for a clause or a non-finite phrase, exactly one of: clause, infinitive, gerund, present-participle, past-participle.
            - "sense": only for an adverbial clause, or an adverbial participle or infinitive phrase, exactly one of: time, place, cause, condition, concession, purpose, result, manner, comparison.
            - "head": only for an attributive, an appositive, or a clause that is an object or complement: the one word it modifies or completes, copied from the Selection (the noun a relative clause describes, the verb an object clause completes).
            - "obstacle": only where a learner is likely to stumble, exactly one of: inversion, fronting, ellipsis, passive, subjunctive, parenthesis, dummy-it, postponed-subject, cleft, comparison, negation, split, idiom.
            - "restore": only with fronting, inversion or ellipsis: the clause in plain word order, with any missing words put back.
            - "note": at most 10 words in {{targetLanguage}}, only when it adds what the keys above cannot say (what an idiom means, what a pronoun refers to).
            - "occurrence": only when the same text appears more than once in the Selection: 1 for the first appearance, 2 for the second, and so on.
            Leave out every optional key that does not apply; never add a key of your own.

            ## What to annotate
            1. The main clause: its subject, predicate, object or complement, and adverbials. There is no annotation for the main clause or the sentence as a whole.
            2. Every subordinate clause: one annotation for the whole clause, with "form": "clause" and the type of the role it plays (a relative clause is attributive; a clause after a verb such as "said" is an object). Then its connector, its predicate, and any subject, object, complement or adverbial inside it that is more than a single pronoun.
            3. Participle, infinitive and gerund phrases, and prepositional phrases of three or more words that modify something.
            4. Skip articles and determiners, a single adjective or adverb next to the word it modifies, the inside of an ordinary noun phrase, and auxiliaries on their own.
            5. A predicate is the whole verb group ("has been meeting"), including a word inside it ("had originally been designed"). When other words split a predicate ("did she turn … down", "rief … an", "ne … pas"), annotate each piece on its own, all as predicates.
            6. The word that opens a clause (that, which, who, if, although, dass, que, …) is its connector, even when it is also the clause's subject or object. Particles and case endings stay inside the phrase they mark.
            7. Spans may nest (a clause contains its parts) but never partly overlap. List annotations in the order they start; when two start at the same place, list the longer one first.

            ## Hard structures
            A structure is never a type: the words keep their roles, and "obstacle" names the structure.
            - Fronting and inversion ("Not until …, did scientists begin …", "Had I known …"): the fronted part keeps its role, with "obstacle": "fronting" and "restore"; an auxiliary or verb placed before its subject is a predicate with "obstacle": "inversion".
            - A cleft ("It was X that …"): X keeps its role, with "obstacle": "cleft" and "restore" (the sentence without "It was … that"). "It was" and "that" get no annotation.
            - A dummy "it" ("It is believed that …"): "It" is a subject with "obstacle": "dummy-it"; the clause it stands for is a subject with "form": "clause" and "obstacle": "postponed-subject".
            - A split verb ("turned … down", "rief … an"): each piece is a predicate with "obstacle": "split".
            - A parenthesis (a phrase or clause set off by commas inside another): its role, with "obstacle": "parenthesis".

            ## $2
            A natural translation of the whole Selection in {{targetLanguage}}.

            ## Format
            The $1 value is a STRING holding a compact JSON array; escape its inner double quotes as \". Do not wrap it in markdown.

            ## Examples
            Selection: The report that the committee published last week, which surprised many readers, was never discussed in public.
            $1: "[{\"text\":\"The report that the committee published last week, which surprised many readers\",\"type\":\"subject\"},{\"text\":\"that the committee published last week\",\"type\":\"attributive\",\"form\":\"clause\",\"head\":\"report\"},{\"text\":\"that\",\"type\":\"connector\"},{\"text\":\"the committee\",\"type\":\"subject\"},{\"text\":\"published\",\"type\":\"predicate\"},{\"text\":\"last week\",\"type\":\"adverbial\"},{\"text\":\"which surprised many readers\",\"type\":\"attributive\",\"form\":\"clause\",\"head\":\"report\",\"obstacle\":\"parenthesis\"},{\"text\":\"which\",\"type\":\"connector\"},{\"text\":\"surprised\",\"type\":\"predicate\"},{\"text\":\"many readers\",\"type\":\"object\"},{\"text\":\"was never discussed\",\"type\":\"predicate\",\"obstacle\":\"passive\"},{\"text\":\"in public\",\"type\":\"adverbial\"}]"

            Selection: Exhausted by the long journey, the travelers decided to rest as soon as they arrived.
