            Selection: Only then did she turn the offer down, fearing it was a trap.
            $1: "[{\"text\":\"Only then\",\"type\":\"adverbial\",\"obstacle\":\"fronting\",\"restore\":\"she turned the offer down only then\"},{\"text\":\"did\",\"type\":\"predicate\",\"obstacle\":\"inversion\"},{\"text\":\"she\",\"type\":\"subject\"},{\"text\":\"turn\",\"type\":\"predicate\",\"obstacle\":\"split\"},{\"text\":\"the offer\",\"type\":\"object\"},{\"text\":\"down\",\"type\":\"predicate\",\"obstacle\":\"split\"},{\"text\":\"fearing it was a trap\",\"type\":\"adverbial\",\"form\":\"present-participle\",\"sense\":\"cause\"},{\"text\":\"it was a trap\",\"type\":\"object\",\"form\":\"clause\",\"head\":\"fearing\",\"obstacle\":\"ellipsis\",\"restore\":\"that it was a trap\"},{\"text\":\"was\",\"type\":\"predicate\"},{\"text\":\"a trap\",\"type\":\"complement\"}]"
