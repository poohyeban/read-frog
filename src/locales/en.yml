          fieldSettingDescription: 'How formal the setting is and what the text is, in {{targetLanguage}}: "<formality> · <what it is>", at most 16 characters.'
          fieldAnnotations: "Annotations"
          fieldAnnotationsDescription: 'A compact JSON array serialized as a string. Each item has "text", "type" and "note", "fix" unless the type is "good", and only the optional keys that apply ("tag", "occurrence").'
          fieldImproved: "Improved"
          fieldImprovedDescription: "The whole Selection as a native writer would write it in this setting, in the Selection's language."
          fieldSummary: "Summary"
          fieldSummaryDescription: "One sentence in {{targetLanguage}}: what works, and the one thing to work on."
          types:
            spelling: "Spelling"
            grammar: "Grammar"
            punctuation: "Punctuation"
            wordChoice: "Word choice"
            logic: "Logic"
            unnatural: "Unidiomatic"
