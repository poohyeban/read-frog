          description: 最大字元數：一次 AI 請求最多帶多少文字
        maxItemsPerBatch:
          description: 最大段落數：多少個段落合併成一次請求。非 AI 的翻譯服務不受這兩項影響
      preloadConfig:
        title: 預翻譯範圍
        description: 控制可視區域下方多少內容會被預先翻譯，以節省 API 費用
