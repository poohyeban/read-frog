          description: 最小字元數：比這更短的文字不翻譯，設為 0 則全部翻譯
        minWords:
          description: 最小詞數：詞數比這更少的文字不翻譯
        error: 數值必須在 $1 到 $2 之間
    translationQueue:
      title: 翻譯佇列
      description: 請求發出的速度、每個請求承載的文字量，以及提前於閱讀位置多遠開始翻譯
      manageQueue: 管理佇列
      requestQueueConfig:
        title: 翻譯速率
        capacity:
          description: 最大突發請求數：同一時刻最多能送出多少個請求
        rate:
          description: 每秒請求數：突發之後的穩定速度。可以填小數，0.25 表示每 4 秒送出一個請求
