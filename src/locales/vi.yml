          fieldSentenceTerm: "Dạng trong câu"
          fieldSentenceTermDescription: 'Vị trí của từ được chọn trong Câu: một mảng JSON được tuần tự hóa thành chuỗi, mỗi phần của từ là một phần tử {"text": chuỗi}, mỗi phần tử trích nguyên văn Câu (ví dụ [{"text":"blossoms"}]).'
