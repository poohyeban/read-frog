          description: "최대 문자 수: 한 번의 AI 요청에 담는 텍스트 양"
        maxItemsPerBatch:
          description: "최대 단락 수: 한 요청에 묶는 단락 수. AI가 아닌 번역 서비스에는 적용되지 않습니다"
