          description: "미리 번역 거리: 화면 아래 몇 픽셀까지 미리 번역할지. 줄이면 API 비용이 절약됩니다"
        threshold:
          description: "표시 기준: 단락이 얼마나 보여야 번역할지, 0에서 1 사이"
