      saveButton: 저장
      savedButton: 저장됨
      validation:
        validating: 검증 중...
        valid: 규칙이 유효합니다
        syntaxError: JSON에 구문 오류가 있습니다
        notArray: JSON 최상위 값은 규칙 배열이어야 합니다
        tooLong: 규칙 문서가 너무 깁니다
        tooMany: 규칙이 너무 많습니다
        duplicateIds: 규칙 id가 중복되었습니다
        schemaErrors: 유효하지 않은 규칙이 있습니다
        moreErrors: ...그리고 $1개의 오류가 더 있습니다
        saved: 모든 변경사항이 저장되었습니다
    builtIn:
