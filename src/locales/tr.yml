        description: Sesin kendi hızına göre ne kadar hızlı ya da yavaş okuduğu, -100 ile 100 yüzde arasında.
      pitch:
        title: Perde
        description: Sesin kendi perdesine göre ne kadar tiz ya da pes konuştuğu, -100 ile 100 hertz arasında.
      volume:
        title: Ses düzeyi
        description: Sesin kendi düzeyine göre ne kadar yüksek ya da alçak okuduğu, -100 ile 100 yüzde arasında.
  videoSubtitles:
    title: Video Altyazıları
    preference:
      enable:
        title: Video altyazılarını aç
        description: YouTube, X ve Netflix'te oynatıcı kontrollerine bir çeviri düğmesi ekler.
      autoStart:
        title: Video açılınca çevir
        description: Video yüklenir yüklenmez, düğmeye basmadan altyazıları çevirmeye başlar.
      aiSegmentation:
        title: AI akıllı bölümlendirme
        description: Yapay zekâ altyazıları cümlelere yeniden böler. Çeviriler daha geç gelir. Güçlü bir LLM gerekir; zayıf modeller satırları atlayabilir veya kaydırabilir.
    aiQuota:
      title: Yapay zekâ altyazı kotası
      description: Yapay zeka konuşma tanıma ile her video için doğru altyazı üretir
    style:
      title: Altyazı stili
      description: Görüntüleme modu, konum, yazı tipleri, renkler ve arka plan — canlı önizlemeye bakarak ayarlanır
      customCSS:
        title: Özel CSS
        description: Yukarıdaki yazı tipleri ve renklerin üzerine, altyazı satırları için ek CSS
    customPrompts:
      title: Özel altyazı istemleri
      description: Yalnızca altyazı çevirisi için istem şablonları; web sayfası çeviri istemlerinden ayrı tutulur
    subtitlesQueue:
      requestQueueConfig:
        title: Çeviri hızı
      batchQueueConfig:
        title: Toplu çeviri
        description: Toplu çeviri için karakter limitleri ve maksimum altyazı satırı sayısını yapılandırın (yalnızca LLM çevirisi için geçerlidir)
    cache:
      clearCache:
        title: AI bölümlendirme önbelleğini temizle
        description: Kaydedilmiş bölümlendirme sonuçları; izlediğiniz bir video yeniden bölünmez
